[package]
name = "netaudio"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "Unofficial Dante-compatible AoIP library (receive-first, Windows / macOS / Linux)"
license = "MIT"
publish = false
authors = ["未完成成果物研究所 / Mikansei Laboratory"]
keywords = ["aoip", "audio", "dante", "network"]
categories = ["multimedia::audio", "network-programming"]
repository = "https://github.com/MikanseiLaboratory/netaudio-rs"

[dependencies]
tokio = { version = "1.53", default-features = false, features = ["net", "time", "sync", "macros", "rt"] }
log = "0.4.34"
thiserror = "2.0"
socket2 = { version = "0.6", features = ["all"] }
byteorder = "1.5"
polling = "3.11"
netdev = "0.46"
cpal = { version = "0.18.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
tokio = { version = "1.53", features = ["net", "time", "sync", "macros", "rt", "rt-multi-thread", "signal"] }

[[example]]
name = "rx"
path = "examples/rx.rs"
required-features = ["cpal"]

[features]
default = []
# Play (not capture) on existing WASAPI / CoreAudio / ALSA host devices.
cpal = ["dep:cpal"]
# Test doubles and Device::start_for_test (skip mDNS/PTP binds).
test-util = []
