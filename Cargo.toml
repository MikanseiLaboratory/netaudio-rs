[package]
name = "netaudio"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
description = "Unofficial Dante-compatible AoIP library (receive-first, cross-platform)"
license = "MIT"
publish = false
authors = ["未完成成果物研究所 / Mikansei Laboratory"]
keywords = ["aoip", "audio", "dante", "network"]
categories = ["multimedia::audio", "network-programming"]
repository = "https://github.com/MikanseiLaboratory/netaudio-rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["net", "time", "sync", "macros", "rt"] }
log = "0.4"
thiserror = "2"
socket2 = { version = "0.5", features = ["all"] }
byteorder = "1.5"
polling = "3"
netdev = "0.32"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "rt-multi-thread"] }

[features]
default = []
# Planned: play/capture on existing WASAPI / CoreAudio / ALSA / ASIO host devices.
cpal = []
# Test doubles and Device::start_for_test (skip mDNS/PTP binds).
test-util = []
