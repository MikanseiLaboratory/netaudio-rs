# cargo-deny: keep the tree MIT-compatible and advisory-clean.
# GPLv3 / AGPL must stay out (Dante protocol + MIT crate).
# Written for cargo-deny 0.20 (GitHub Action EmbarkStudios/cargo-deny-action@v2).

[advisories]
yanked = "warn"
# Unmaintained transitive crates are common; fail only on this workspace crate.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
